<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stage Soundboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }

        /* Responsive grid adapting to screen size and tile count automatically */
        #sound-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
        }

        @media (min-width: 768px) {
            #sound-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1.5rem;
            }
        }

        /* Tile base styling */
        .tile {
            transition: all 0.15s ease-in-out;
            min-height: 160px;
            cursor: grab;
        }

        /* Dragging active state */
        .tile.dragging {
            opacity: 0.4;
            cursor: grabbing;
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8) !important;
            z-index: 50;
        }

        /* Active click state for the panic button */
        #panic-btn:active {
            transform: scale(0.98);
        }

        /* Ensures text remains somewhat legible even on lighter chosen tile colors */
        .text-shadow {
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
        }
        
        /* Make native color picker look a bit cleaner */
        input[type="color"] {
            appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
        }

        /* Custom Volume Slider Orientation */
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            background: #4b5563;
            border-radius: 8px;
            outline: none;
        }
        @media (min-width: 768px) {
            .volume-slider {
                -webkit-appearance: slider-vertical;
                appearance: slider-vertical;
                width: 12px;
                background: transparent;
            }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col">

    <div class="max-w-7xl mx-auto w-full flex-grow flex flex-col md:flex-row pb-24 md:pb-0">
        
        <!-- MAIN CONTENT AREA -->
        <div class="flex-grow flex flex-col pr-0 md:pr-8">
            <!-- HEADER / PANIC BUTTON & UPLOAD -->
            <div class="flex flex-col md:flex-row gap-4 mb-8 items-center">
                <button id="panic-btn" onclick="stopAllAudio()" class="flex-grow bg-red-700 hover:bg-red-600 text-white font-black text-2xl md:text-3xl py-4 rounded-xl border-2 border-red-900 shadow-[0_0_15px_rgba(220,38,38,0.3)] uppercase tracking-wider transition-transform">
                    🛑 Stop All Audio
                </button>
                
                <button onclick="document.getElementById('audio-upload').click()" class="md:w-1/3 md:max-w-[250px] bg-blue-700 hover:bg-blue-600 text-white font-bold text-xl py-4 rounded-xl border-2 border-blue-900 shadow-lg transition-colors">
                    ➕ Add Sound Cue
                </button>
                <input type="file" id="audio-upload" accept="audio/*" class="hidden" onchange="handleAudioUpload(event)">
            </div>

            <!-- SOUNDBOARD GRID -->
            <!-- Starts empty, dynamically filled -->
            <div id="sound-grid" class="flex-grow content-start pb-10">
                <!-- Empty state placeholder (hidden once items are added) -->
                <div id="empty-state" class="col-span-full text-center text-gray-500 mt-20">
                    <p class="text-xl md:text-2xl mb-2">No sound cues added.</p>
                    <p class="text-sm md:text-base">Click "Add Sound Cue" to upload audio files from your device.</p>
                </div>
            </div>
        </div>

        <!-- MASTER VOLUME (Right Sidebar on Desktop, Bottom Bar on Mobile) -->
        <div class="fixed bottom-0 left-0 w-full md:relative md:w-16 lg:w-24 flex-shrink-0 flex md:flex-col items-center justify-center md:justify-start border-t-2 md:border-t-0 md:border-l-2 border-gray-800 p-4 md:p-0 md:pl-4 lg:pl-8 md:pb-10 bg-gray-900 md:bg-transparent z-40">
            <div class="bg-gray-800/80 p-3 md:p-4 rounded-3xl md:rounded-full border border-gray-700 shadow-inner flex flex-row md:flex-col items-center gap-4 md:gap-6 w-full max-w-md md:w-auto h-auto md:h-[70vh] md:min-h-[300px]">
                <span class="text-xl md:text-2xl" title="Master Volume">🔊</span>
                <div class="flex-grow relative w-full h-8 md:h-full md:w-12 flex items-center md:justify-center py-0 md:py-2">
                    <input type="range" id="master-volume" min="0" max="1" step="0.01" value="1" 
                           class="w-full h-2 md:h-full cursor-pointer accent-blue-500 volume-slider" 
                           oninput="updateMasterVolume(this.value)">
                </div>
                <span class="text-xs md:text-sm text-gray-400 font-bold">VOL</span>
            </div>
        </div>

    </div>

    <!-- EDIT MODAL OVERLAY -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h2 id="modal-title" class="text-2xl font-bold mb-4">Edit Sound Cue</h2>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-1">Name</label>
                <input type="text" id="edit-name-input" class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500 shadow-inner">
            </div>
            
            <div class="mb-8">
                <label class="block text-sm text-gray-400 mb-2">Color</label>
                <div class="flex items-center gap-3">
                    <input type="color" id="edit-color-input" class="w-12 h-12 bg-transparent border-0 cursor-pointer p-0">
                    <span class="text-sm text-gray-500">Select tile background</span>
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-sm text-gray-400 mb-1">Keyboard Shortcut</label>
                <input type="text" id="edit-shortcut-input" maxlength="1" class="w-20 text-center bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500 shadow-inner uppercase font-bold text-xl" placeholder="e.g. A">
            </div>
            
            <div class="flex justify-end gap-3">
                <button onclick="closeEditModal()" class="px-5 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition-colors font-semibold">Cancel</button>
                <button id="modal-save-btn" onclick="saveModal()" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 transition-colors text-white font-bold shadow-lg shadow-blue-900/50">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Start completely empty
        const soundCues = [];
        let customCueCounter = 1;
        const audioElements = {};
        let masterVolume = 1.0;
        let draggedTile = null; // Track the currently dragged tile
        let spacebarPausedIds = new Set(); // Track which audios were paused by spacebar
        
        // Array of default colors to assign to new tiles sequentially
        const defaultColors = ['#1f2937', '#7c2d12', '#064e3b', '#1e3a8a', '#4c1d95', '#831843'];

        /**
         * Creates a new tile in the DOM and registers the audio element
         */
        function createTile(cue) {
            const grid = document.getElementById('sound-grid');
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.style.display = 'none'; // Hide empty message

            // 1. Create and preload the Audio Object
            const audio = new Audio(cue.url);
            audio.preload = 'auto';
            audio.volume = cue.volume * masterVolume;
            audioElements[cue.id] = audio;

            // 2. Create the Tile Container
            const tile = document.createElement('div');
            tile.id = `tile-${cue.id}`;
            tile.className = `tile relative border-2 border-transparent text-white rounded-2xl flex flex-col justify-between p-4 shadow-lg`;
            tile.style.backgroundColor = cue.color;
            tile.setAttribute('draggable', 'true'); // Enable HTML5 Drag and Drop

            // --- Drag and Drop Event Listeners ---
            tile.addEventListener('dragstart', (e) => {
                // Prevent dragging if the user is trying to interact with controls
                if (['INPUT', 'BUTTON'].includes(e.target.tagName)) {
                    e.preventDefault();
                    return;
                }
                draggedTile = tile;
                // Defer the class addition so the browser captures the normal tile for the "ghost" image
                setTimeout(() => tile.classList.add('dragging'), 0);
            });

            tile.addEventListener('dragend', () => {
                tile.classList.remove('dragging');
                draggedTile = null;
            });

            tile.addEventListener('dragover', (e) => {
                e.preventDefault(); // Necessary to allow a drop action
                if (!draggedTile || draggedTile === tile) return;

                const grid = document.getElementById('sound-grid');
                const rect = tile.getBoundingClientRect();
                
                // Determine if we should insert before or after the hovered tile based on mouse X position
                const insertAfter = (e.clientX - rect.left) / (rect.right - rect.left) > 0.5;
                grid.insertBefore(draggedTile, insertAfter ? tile.nextSibling : tile);
            });
            
            // --- Touch Drag and Drop Event Listeners (Mobile) ---
            let touchTimer = null;
            let isDraggingTouch = false;

            tile.addEventListener('touchstart', (e) => {
                if (['INPUT', 'BUTTON'].includes(e.target.tagName)) return;
                
                // Use a short delay to differentiate between a tap (play) and a long press (drag)
                touchTimer = setTimeout(() => {
                    isDraggingTouch = true;
                    draggedTile = tile;
                    tile.classList.add('dragging');
                    document.body.style.overflow = 'hidden'; // Prevent scrolling while dragging
                }, 300);
            }, { passive: true });

            tile.addEventListener('touchmove', (e) => {
                if (!isDraggingTouch || draggedTile !== tile) {
                    clearTimeout(touchTimer);
                    return;
                }
                e.preventDefault(); // Stop mobile screen scrolling
                
                const touch = e.touches[0];
                const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
                
                if (targetElement) {
                    const dropTarget = targetElement.closest('.tile');
                    if (dropTarget && dropTarget !== tile) {
                        const grid = document.getElementById('sound-grid');
                        const rect = dropTarget.getBoundingClientRect();
                        const insertAfter = (touch.clientX - rect.left) / (rect.right - rect.left) > 0.5;
                        grid.insertBefore(draggedTile, insertAfter ? dropTarget.nextSibling : dropTarget);
                    }
                }
            }, { passive: false });

            const endTouchDrag = () => {
                clearTimeout(touchTimer);
                if (isDraggingTouch) {
                    tile.classList.remove('dragging');
                    draggedTile = null;
                    isDraggingTouch = false;
                    document.body.style.overflow = ''; // Restore scrolling
                }
            };

            tile.addEventListener('touchend', endTouchDrag);
            tile.addEventListener('touchcancel', endTouchDrag);

            let pauseBtn; // Declare here so updateVisuals can access it to change the icon

            // Visual active state logic
            const updateVisuals = (isPlaying) => {
                if (isPlaying) {
                    tile.style.boxShadow = `0 0 25px ${tile.style.backgroundColor}, inset 0 0 10px rgba(255,255,255,0.2)`;
                    tile.style.borderColor = '#ffffff';
                    tile.style.transform = 'scale(0.98)';
                    if (pauseBtn) pauseBtn.innerHTML = '⏸ Pause';
                } else {
                    tile.style.boxShadow = 'none';
                    tile.style.borderColor = 'transparent';
                    tile.style.transform = 'scale(1)';
                    if (pauseBtn) pauseBtn.innerHTML = '▶️ Play';
                }
            };

            // Sync UI state automatically with native audio events
            audio.addEventListener('play', () => updateVisuals(true));
            audio.addEventListener('pause', () => updateVisuals(false));
            audio.addEventListener('ended', () => updateVisuals(false));

            // Main tile acts as Play button (and restarts if already playing)
            tile.onclick = () => {
                spacebarPausedIds.delete(cue.id); // Remove from spacebar pause group if manually interacted with
                if (!audio.paused) {
                    audio.currentTime = 0; // Restart from beginning if clicked again
                }
                audio.play().catch(e => console.error("Playback failed:", e));
            };

            // 3. Header Container (Title + Edit Button)
            const headerDiv = document.createElement('div');
            headerDiv.className = 'flex justify-between items-start gap-3 w-full';

            // Shortcut Badge
            const shortcutBadge = document.createElement('div');
            shortcutBadge.className = `absolute -top-3 -right-3 bg-blue-600 border-2 border-gray-900 text-white font-bold rounded-full w-8 h-8 flex items-center justify-center shadow-lg transform transition-transform ${cue.shortcut ? '' : 'hidden'}`;
            shortcutBadge.innerText = cue.shortcut ? cue.shortcut.toUpperCase() : '';
            shortcutBadge.id = `shortcut-${cue.id}`;
            tile.appendChild(shortcutBadge);

            // Read-only Title
            const titleSpan = document.createElement('span');
            titleSpan.innerText = cue.label;
            titleSpan.className = 'font-bold text-xl md:text-2xl w-full truncate text-shadow pointer-events-none';

            // Edit Button (Pencil Icon)
            const editBtn = document.createElement('button');
            editBtn.innerHTML = '✏️';
            editBtn.className = 'bg-black/30 hover:bg-black/60 p-2 md:p-3 rounded-full backdrop-blur-sm transition-colors cursor-pointer flex-shrink-0 text-sm md:text-base border border-white/10 hover:border-white/30';
            editBtn.title = "Edit Name and Color";
            editBtn.onclick = (e) => {
                e.stopPropagation(); // Don't play sound when clicking edit
                openEditModal(cue, tile, titleSpan);
            };

            headerDiv.appendChild(titleSpan);
            headerDiv.appendChild(editBtn);

            // 4. Controls Container (Pause, Stop, Volume)
            const controlsWrapper = document.createElement('div');
            controlsWrapper.className = 'flex flex-col gap-3 w-full mt-6';

            const btnGroup = document.createElement('div');
            btnGroup.className = 'flex gap-2 w-full';

            // Pause/Play Toggle Button
            pauseBtn = document.createElement('button');
            pauseBtn.innerHTML = '▶️ Play';
            pauseBtn.className = 'flex-1 bg-black/40 hover:bg-black/60 border border-white/10 text-white font-bold py-2 md:py-3 rounded-xl text-sm md:text-base backdrop-blur-sm transition-colors';
            pauseBtn.onclick = (e) => {
                e.stopPropagation(); 
                spacebarPausedIds.delete(cue.id); // clear spacebar state to prevent conflicts
                if (audio.paused) {
                    audio.play().catch(e => console.error("Playback failed:", e));
                } else {
                    audio.pause();
                }
            };

            // Stop Button
            const stopBtn = document.createElement('button');
            stopBtn.innerHTML = '⏹ Stop';
            stopBtn.className = 'flex-1 bg-red-600/80 hover:bg-red-500 border border-red-400/30 text-white font-bold py-2 md:py-3 rounded-xl text-sm md:text-base transition-colors';
            stopBtn.onclick = (e) => {
                e.stopPropagation(); 
                spacebarPausedIds.delete(cue.id); // clear spacebar state to prevent conflicts
                audio.pause();
                audio.currentTime = 0;
            };

            btnGroup.appendChild(pauseBtn);
            btnGroup.appendChild(stopBtn);
            
            // Tile Volume Slider
            const volGroup = document.createElement('div');
            volGroup.className = 'flex items-center justify-end gap-2 w-full';
            
            const volIcon = document.createElement('span');
            volIcon.innerHTML = '🔉';
            volIcon.className = 'text-sm text-white/80';
            
            const volSlider = document.createElement('input');
            volSlider.type = 'range';
            volSlider.min = '0';
            volSlider.max = '1';
            volSlider.step = '0.01';
            volSlider.value = cue.volume;
            volSlider.className = 'w-24 cursor-pointer accent-white/80';
            volSlider.title = "Tile Volume";
            volSlider.onclick = (e) => e.stopPropagation(); // prevent tile click
            volSlider.oninput = (e) => {
                e.stopPropagation();
                cue.volume = parseFloat(e.target.value);
                updateTileVolume(cue.id);
            };
            
            volGroup.appendChild(volIcon);
            volGroup.appendChild(volSlider);

            controlsWrapper.appendChild(btnGroup);
            controlsWrapper.appendChild(volGroup);
            
            tile.appendChild(headerDiv);
            tile.appendChild(controlsWrapper);

            grid.appendChild(tile);
        }

        let pendingAddData = null;
        let modalMode = 'edit'; // 'edit' or 'add'

        /**
         * Handles local file uploads and opens the Add Modal
         */
        function handleAudioUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const file = files[0];
            const fileUrl = URL.createObjectURL(file);
            
            // Pick a color from the default array sequentially
            const assignedColor = defaultColors[(customCueCounter - 1) % defaultColors.length];
            const defaultName = file.name.replace(/\.[^/.]+$/, ""); // Strip file extension

            pendingAddData = {
                url: fileUrl
            };

            modalMode = 'add';
            document.getElementById('modal-title').innerText = "Add New Sound Cue";
            document.getElementById('modal-save-btn').innerText = "Add Cue";
            
            document.getElementById('edit-name-input').value = defaultName;
            document.getElementById('edit-color-input').value = assignedColor;
            document.getElementById('edit-shortcut-input').value = '';
            
            document.getElementById('edit-modal').classList.remove('hidden');
            
            // Reset input so the same file can be uploaded again if needed
            event.target.value = '';
        }

        // --- MODAL LOGIC ---
        let currentEditCue = null;
        let currentEditTile = null;
        let currentEditTitleSpan = null;

        function openEditModal(cue, tileElement, titleElement) {
            modalMode = 'edit';
            document.getElementById('modal-title').innerText = "Edit Sound Cue";
            document.getElementById('modal-save-btn').innerText = "Save Changes";

            currentEditCue = cue;
            currentEditTile = tileElement;
            currentEditTitleSpan = titleElement;

            // Populate current values
            document.getElementById('edit-name-input').value = cue.label;
            document.getElementById('edit-color-input').value = cue.color;
            document.getElementById('edit-shortcut-input').value = cue.shortcut || '';
            
            // Show modal
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            currentEditCue = null;
            currentEditTile = null;
            currentEditTitleSpan = null;
            pendingAddData = null;
        }

        function saveModal() {
            const newName = document.getElementById('edit-name-input').value;
            const newColor = document.getElementById('edit-color-input').value;
            const newShortcut = document.getElementById('edit-shortcut-input').value.trim().charAt(0).toUpperCase();

            if (modalMode === 'add' && pendingAddData) {
                const newCue = {
                    id: 'custom-' + customCueCounter++,
                    label: newName || 'Untitled',
                    url: pendingAddData.url,
                    color: newColor,
                    volume: 1.0,
                    shortcut: newShortcut
                };
                soundCues.push(newCue);
                createTile(newCue);
            } else if (modalMode === 'edit' && currentEditCue) {
                // Update data model
                currentEditCue.label = newName;
                currentEditCue.color = newColor;
                currentEditCue.shortcut = newShortcut;

                // Update Tile UI
                currentEditTitleSpan.innerText = newName;
                currentEditTile.style.backgroundColor = newColor;

                const badge = document.getElementById(`shortcut-${currentEditCue.id}`);
                if (badge) {
                    badge.innerText = newShortcut;
                    if (newShortcut) {
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                }

                // Update glow color if it happens to be playing right now
                const audio = audioElements[currentEditCue.id];
                if (audio && !audio.paused) {
                    currentEditTile.style.boxShadow = `0 0 25px ${newColor}, inset 0 0 10px rgba(255,255,255,0.2)`;
                }
            }

            closeEditModal();
        }

        /**
         * Halts and resets all sounds immediately.
         */
        function stopAllAudio() {
            Object.keys(audioElements).forEach(id => {
                const audio = audioElements[id];
                if (!audio.paused) {
                    audio.pause();
                }
                audio.currentTime = 0; 
            });
            spacebarPausedIds.clear(); // Clear pause state when manually stopping all
        }
        
        /**
         * Updates the master volume state and applies it to all active cues
         */
        function updateMasterVolume(val) {
            masterVolume = parseFloat(val);
            soundCues.forEach(cue => {
                updateTileVolume(cue.id);
            });
        }

        /**
         * Calculates and sets the effective volume for a specific audio element
         */
        function updateTileVolume(id) {
            const audio = audioElements[id];
            const cue = soundCues.find(c => c.id === id);
            if (audio && cue) {
                audio.volume = cue.volume * masterVolume;
            }
        }

        // --- KEYBOARD SHORTCUTS ---
        document.addEventListener('keydown', (e) => {
            // Ignore keystrokes if the user is typing in an input field (like the edit modal)
            if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

            // Global Spacebar: Pause All / Resume Paused
            if (e.code === 'Space') {
                e.preventDefault(); // Prevent page scroll down
                
                let anyPlaying = false;
                Object.values(audioElements).forEach(audio => {
                    if (!audio.paused) anyPlaying = true;
                });

                if (anyPlaying) {
                    // Pause all currently playing audio
                    spacebarPausedIds.clear();
                    Object.keys(audioElements).forEach(id => {
                        const audio = audioElements[id];
                        if (!audio.paused) {
                            audio.pause();
                            spacebarPausedIds.add(id);
                        }
                    });
                } else if (spacebarPausedIds.size > 0) {
                    // Resume audio that was specifically paused by the spacebar
                    spacebarPausedIds.forEach(id => {
                        const audio = audioElements[id];
                        if (audio && audio.paused) {
                            audio.play().catch(err => console.error("Resume failed:", err));
                        }
                    });
                    spacebarPausedIds.clear();
                }
                return;
            }

            // Custom Tile Shortcuts
            const key = e.key.toLowerCase();
            const cueToTrigger = soundCues.find(c => c.shortcut && c.shortcut.toLowerCase() === key);
            
            if (cueToTrigger) {
                e.preventDefault();
                const tile = document.getElementById(`tile-${cueToTrigger.id}`);
                if (tile) tile.click(); // Simulate a click on the main tile
            }
        });

    </script>
</body>
</html>
